[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxsim-emissions-extension"
version = "0.1.0"
description = "Modular emissions modelling extension for the UXsim traffic simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uxsim>=1.12,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
osm = [
    "osmnx>=2.0,<3",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
]
viz = [
    "matplotlib>=3.8,<4",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.11,<0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

